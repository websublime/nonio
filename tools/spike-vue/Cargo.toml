[package]
name = "spike-vue"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false

# Standalone: not a workspace member, so it does not change nonio's lockfile, CI or MSRV.
[workspace]

[dependencies]
vue_oxlint_jsx = "=0.15.0"
vue_oxlint_parser = "=0.15.0"
oxc_allocator = "=0.129.0"
oxc_ast = "=0.129.0"
oxc_ast_visit = "=0.129.0"
oxc_parser = "=0.129.0"
oxc_semantic = "=0.129.0"
oxc_span = "=0.129.0"
oxc_syntax = "=0.129.0"
# Only for the `baseline` binary: nonio's own oxc 0.153 backend on the same fixture.
nonio-scan = { path = "../../crates/nonio-scan" }
nonio-facts = { path = "../../crates/nonio-facts" }
serde_json = "1"
