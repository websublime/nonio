[package]
name = "nonio-scan"
description = "Extraction backends of nonio: facts from source code, behind the Extractor trait of nonio-facts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nonio-facts = { path = "../nonio-facts" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_ast_visit = "=0.153.0"
oxc_parser = "=0.153.0"
oxc_semantic = "=0.153.0"
oxc_span = "=0.153.0"
oxc_syntax = "=0.153.0"
fancy-regex = "0.20"
indexmap.workspace = true
oxc_resolver = "=11.24.2"
# HTML of Vue templates (D28); MIT. Only its parser and scanner are used.
vue-compiler-core = { version = "=0.1.0", default-features = false }
# Java, Kotlin and Python (D14); Apache-2.0. Beta: pinned, and every edge is checked again in src/graph.rs.
code2graph = { version = "=0.0.0-beta.17", default-features = false, features = ["java", "kotlin", "python"] }
# Spring routes (annotations) read from the syntax tree; the same versions code2graph already builds. MIT.
tree-sitter = "=0.26.13"
tree-sitter-java = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
