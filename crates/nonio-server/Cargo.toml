[package]
name = "nonio-server"
description = "The nonio server: host profiles, the bridge that hands work to the host's model, and the map store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nonio-core = { path = "../nonio-core" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
jsonschema = { version = "0.63", default-features = false }
nonio-facts = { path = "../nonio-facts" }
nonio-scan = { path = "../nonio-scan" }
indexmap.workspace = true
regex.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net", "rt-multi-thread"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.3"
form_urlencoded = "1"
percent-encoding = "2"

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }
tokio-tungstenite = "0.29"
