[workspace]
resolver = "2"
members = ["crates/nonio-facts", "crates/nonio-scan", "crates/nonio-core", "crates/nonio-server"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/websublime/nonio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
globset = "0.4"
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
pretty_assertions = "1"
