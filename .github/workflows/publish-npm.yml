# dist's custom publish job (dist-workspace.toml, publish-jobs): after the GitHub Release exists, publish its npm
# packages (D24) to public npm with tools/npm-packages/publish.sh. Without the NPM_TOKEN secret it warns and skips,
# so the release itself still goes out.
name: publish npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Publish
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::No NPM_TOKEN secret: the npm packages for $TAG were not published."
            exit 0
          fi
          tools/npm-packages/publish.sh "$TAG" https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
