name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins stable; the variable overrides it so this job really builds with 1.97.
      - run: cargo test --all --locked
        env:
          RUSTUP_TOOLCHAIN: "1.97"

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      # The viewer's tests read their maps through nonio itself (the viewer-maps example).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The binary built after the viewer carries it.
      - run: cargo test -p nonio-cli --locked
        working-directory: .
        env:
          NONIO_EXPECT_VIEWER: "1"

  plugin:
    runs-on: ubuntu-latest
    env:
      # Agent Plugins 1.0.0's schemas, from the spec repo at a fixed commit (Apache-2.0; not copied into this repo).
      SPEC: https://raw.githubusercontent.com/agentplugins/agent-plugins-spec/6395e8906b30e2f333b792bfaa981d790993d56f/schemas/1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          curl -fsSL "$SPEC/plugin.schema.json" -o "$RUNNER_TEMP/plugin.schema.json"
          curl -fsSL "$SPEC/mcp.schema.json" -o "$RUNNER_TEMP/mcp.schema.json"
      - run: npx -y ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s "$RUNNER_TEMP/plugin.schema.json" -d plugin/plugin.json
      - run: npx -y ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s "$RUNNER_TEMP/mcp.schema.json" -d plugin/mcp.json
      # The release PR bumps the versions above through knope.toml.
      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.24.0
      # A PR is checked out detached; knope validates its workflows from the tip of a branch.
      - run: git switch -c knope-validate && knope --validate

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p nonio-cli --locked
      # The same layout as dist's archive for this target, so build.mjs reads it as it reads a release's.
      - run: |
          a=nonio-cli-x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/archives/$a"
          cp target/release/nonio LICENSE NOTICE README.md "$RUNNER_TEMP/archives/$a/"
          tar -C "$RUNNER_TEMP/archives" -cJf "$RUNNER_TEMP/archives/$a.tar.xz" "$a"
      - run: node tools/npm-packages/build.mjs --archives "$RUNNER_TEMP/archives" --out "$RUNNER_TEMP/npm"
      # From a registry that holds only these packages, with install scripts off: how the plugin starts nonio (D24).
      - run: tools/npm-packages/smoke.sh "$RUNNER_TEMP/npm"
